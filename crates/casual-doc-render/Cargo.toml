[package]
name = "casual-doc-render"
description = "Display-list rendering backends for OpenDoc (CPU raster; canvas/GPU later)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
casual-doc-layout.workspace = true
skrifa = "0.43"
tiny-skia = "0.11"
# Raster image decoding for inline pictures (PNG + JPEG). Permissive
# (MIT-or-Apache-2.0), pure-Rust and WASM-clean: only the `png` and `jpeg`
# codec features are enabled, so no native/C backends are pulled in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
casual-doc-model.workspace = true
casual-doc-import.workspace = true
casual-doc-ooxml.workspace = true

[lints]
workspace = true
