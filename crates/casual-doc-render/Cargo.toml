[package]
name = "casual-doc-render"
description = "Display-list rendering backends for OpenDoc (CPU raster; canvas/GPU later)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Forwards to `casual-doc-layout/system-fonts`: enables the native OS font
# fallback so examples/tests that render CJK/complex text pick up installed
# system faces. OFF by default; compiled out on `wasm32`.
system-fonts = ["casual-doc-layout/system-fonts"]

[dependencies]
casual-doc-layout.workspace = true
# The display list's `PaintItem::Image` carries the model's `CropRect`
# (`a:srcRect`), applied when blitting a cropped picture. Pure-Rust, WASM-clean.
casual-doc-model.workspace = true
skrifa = "0.43"
tiny-skia = "0.11"
# Raster image decoding for inline pictures. Permissive (MIT-or-Apache-2.0),
# pure-Rust and WASM-clean: only these codec features are enabled, so no
# native/C backends are pulled in. PNG/JPEG are the common web formats; GIF/BMP/
# TIFF are common in Office-authored DOCX (pasted art, scanned pages) and shared
# the same generic decode path — previously they fell back to a placeholder box.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
] }

[dev-dependencies]
casual-doc-import.workspace = true
casual-doc-ooxml.workspace = true
serde_json.workspace = true

[lints]
workspace = true
