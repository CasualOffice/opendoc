[package]
name = "casual-doc-pdf-save"
description = "The planning half of OpenDoc's byte-preserving PDF save: the import's content digests, and which pages, frames and show operators an edited PDF-origin document rewrites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# No PDF parser and no layout engine (`docs/182` §17a). The editor's lazily
# loaded PDF module links this crate and answers the main module's save with
# its plan; a native host links it through `casual-doc-io`'s `pdf-import`. The
# main WebAssembly module does not link it at all: that is the point of the
# crate.
[dependencies]
casual-doc-model.workspace = true
# The content projection and digest the version history already uses: the one
# definition of "the same content" in this workspace.
casual-doc-diff.workspace = true
casual-doc-pdf-wire.workspace = true

[dev-dependencies]
# The tests plan saves of a real import. The reader's in-tree fallbacks are the
# ones a native host enables (`casual-doc-pdf-import`'s own dev-dependencies).
casual-doc-pdf-import.workspace = true
casual-doc-pdf-read = { workspace = true, features = ["liberation-faces", "embedded-cmaps"] }

[lints]
workspace = true
