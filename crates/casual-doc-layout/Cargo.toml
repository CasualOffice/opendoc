[package]
name = "casual-doc-layout"
description = "Layout, pagination, and display-list engine for OpenDoc (Phase 1C-1E)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Omits the Roboto asset bytes only when compiling for `wasm32`. Browser hosts
# supply Roboto through the runtime font registry; native/headless builds retain
# the complete deterministic bundle even under `--all-features`.
external-web-fonts = []
# Native OS font fallback. Turns on `fontique`'s system font source (through
# `parley`) so a run whose code points are not covered by the bundled faces
# (CJK, symbols, complex scripts) shapes with an installed OS font, which the
# shaper interns into the shared `font_registry` for the renderer to rasterize.
# OFF by default: the bundled path stays deterministic and the system source is
# fully compiled out for `wasm32` and golden/deterministic runs.
#
# `fontconfig-dlopen` loads libfontconfig at runtime rather than linking it at
# build time, so the crate builds on Linux/BSD hosts (incl. CI) without the
# fontconfig -dev package installed; on macOS/Windows the OS APIs are used and
# this is a no-op.
system-fonts = ["parley/system", "fontique/system", "fontique/fontconfig-dlopen"]

[dependencies]
casual-doc-model.workspace = true
# The complex-script feature selects ICU's dictionary-backed CJK/Thai/etc.
# segmenters. Without it, ICU falls back to character breaking but also reports
# one missing-model error per complex-script segmentation pass (2,150 warnings
# for the SDS fidelity probe), flooding hosts during otherwise-successful layout.
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }
# Re-exported by `parley` (same 0.11 crate); a direct dependency here so the
# `system-fonts` feature can select fontique's `fontconfig-dlopen`, and so the
# shaper/registry can name `fontique::{Blob, Script}` directly.
fontique = { version = "0.11", default-features = false, features = ["std"] }
# Parse-only OpenType reader (fontations) for glyph-coverage checks in the font
# resolver. No system/`fontconfig` access — WASM-clean. Already in the tree via
# `parley`/`fontique`, so no new version is introduced.
skrifa = { version = "0.43", default-features = false }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
