[package]
name = "casual-doc-wasm"
description = "wasm-bindgen façade over the OpenDoc engine (import → paginate → render) for the browser/webview viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# `cdylib` for the web/webview WASM target (wasm-pack output); `rlib` so a native
# desktop backend can link the same façade without WASM (doc 56 escape hatch) and
# so native parity tests exercise the same code.
crate-type = ["cdylib", "rlib"]

[features]
# Browser builds keep Roboto/Noto assets in the host and register them at
# runtime. The layout feature is target-gated, so native parity tests retain the
# deterministic complete bundle.
default = ["web-host-fonts"]
web-host-fonts = ["casual-doc-layout/external-web-fonts"]
# Opt-in second raster (`docs/architecture/179`, ADR-073 Proposed): `renderPageSparse`, the
# same page through `casual-doc-render-gpu`'s sparse-strip encoder on
# `vello_cpu`. OFF by default and not built by `webapp/build.sh`, so the shipped
# module and `renderPage` are unchanged; a host that builds with it gets one more
# export with `renderPage`'s exact contract to A/B against.
sparse-raster = ["dep:casual-doc-render-gpu", "casual-doc-render-gpu/sparse-cpu"]

# Modern rustc emits bulk-memory / sign-ext / nontrapping-fptoint instructions by
# default; `wasm-opt` must be told to accept them, or validation fails. These
# flags keep the size pass working with the version wasm-pack ships.
#
# `-Oz`, not `-O`. Binaryen's bare `-O` is optimize-level 2 / shrink-level 1,
# which is exactly `-Os` — measured here, `-O` and `-Os` produced byte-identical
# 26,063,048 B modules. `-Oz` is shrink-level 2 and is the only one of the three
# that is actually a size pass. On its own it is small (25,800,405 B, -1.0%);
# paired with `webapp/build.sh`'s `opt-level = z` it takes the module from
# 22,326,146 B to 20,903,695 B. Cheap, too: 27 s on the 27 MB pre-opt module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-sign-ext', '--enable-nontrapping-float-to-int']

[dependencies]
casual-doc-diff.workspace = true
casual-doc-edit.workspace = true
casual-doc-export.workspace = true
casual-doc-import.workspace = true
# `pdf-source`: a PDF-origin session without the PDF reader (`docs/182`
# §17a). The reader, the importer and hayro are in the lazily loaded PDF
# module (`casual-doc-wasm-pdf`); `webapp/tests/wasm_size.test.mjs` fails the
# build if hayro is ever linked here again.
casual-doc-io = { workspace = true, features = ["pdf-source"] }
casual-doc-layout.workspace = true
casual-doc-model.workspace = true
casual-doc-ooxml.workspace = true
casual-doc-render.workspace = true
# The one capability registry: lowerings the editor shares with every agent
# front door (`docs/181`, ADR-075).
casual-doc-command.workspace = true
# The in-page assistant's reads and plan compiler (`editor.ai`, `docs/178` §9,
# `docs/181` §4.4): the same code the MCP server runs, so a plan compiles one way.
casual-doc-ai.workspace = true
# Only with `sparse-raster` (above).
casual-doc-render-gpu = { workspace = true, optional = true }
# The one lowering of review edits (suggestions, comments, decisions), shared
# with the Native SDK and the MCP server (`docs/178` §8 A1).
casual-doc-review.workspace = true
# The rectangular cell selection and its merged-cell expansion live in the
# selection crate, beside `TextSelection`: OT will have to transform a cell
# selection exactly as it transforms a text one (ADR-033), and a facade-local
# copy would guarantee a second implementation of one rule.
casual-doc-selection.workspace = true
# The transaction envelope and the revision log: EVERY mutation of the live
# document goes through it (doc 147, ADR-043, ADR-005). This dependency used to
# be absent, which is precisely how ADR-005 came to be honoured nowhere.
casual-doc-transaction.workspace = true
# Unicode word segmentation for double-click word selection.
unicode-segmentation.workspace = true
# The rich-clipboard payload crosses the JS boundary as one JSON string (bridge,
# not engine) rather than a bespoke wasm-bindgen struct array.
serde.workspace = true
serde_json.workspace = true
# The JS↔WASM boundary. MIT-or-Apache-2.0, pure-Rust glue; compiles on native
# too (the annotations are inert without a JS host), so the parity tests run
# under `cargo test`.
wasm-bindgen = "0.2"

[dev-dependencies]
casual-doc-pdf.workspace = true
# The native tests run a real import through the PDF module's own code and the
# in-process revision reader; dev-dependencies, so the shipped module links
# neither.
casual-doc-wasm-pdf.workspace = true
casual-doc-io = { workspace = true, features = ["pdf-import"] }

[lints]
workspace = true
