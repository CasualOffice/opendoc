[package]
name = "casual-doc-edit"
description = "The closed editing op set on v1::Document (doc 59): apply + inverses for undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
casual-doc-model.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The field-result guards drive the repository's real `sample.docx` footer rather
# than a constructed fixture: the defect they cover turned on how that file's
# four-part complex fields IMPORT (an inline `Field`, not a `FieldRange` pair),
# which only the importer can answer. Dev-only, and neither crate depends on this
# one, so there is no cycle.
casual-doc-import.workspace = true
casual-doc-ooxml.workspace = true
# `paragraph_length_agrees_with_the_text_the_reader_sees` compares this crate's
# `inline_text_len` against `casual_doc_layout::flow::node_plain_text`, the two
# answers to "how long is this paragraph" whose disagreement has now been found
# three times (HF-213). A same-crate test cannot make a fourth one fail the build;
# this can. Dev-only, and the layout crate depends on `casual-doc-model` alone, so
# there is no cycle.
casual-doc-layout.workspace = true

[lints]
workspace = true
