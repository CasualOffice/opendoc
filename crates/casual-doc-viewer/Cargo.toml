[package]
name = "casual-doc-viewer"
description = "Read-only OpenDoc engine cut (open, paginate, render, PDF) for the Viewer SDK and the headless render/convert path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `docs/176` §4, ADR-071 (proposed). This crate is the MEASURED cut the Viewer SDK
# and the headless render/convert path stand on: import → paginate → compose →
# raster (and optionally PDF), with none of the editing machinery. It depends on
# NO crate the editor alone needs — not `casual-doc-edit`, `casual-doc-transaction`,
# `casual-doc-selection`, `casual-doc-diff` or `casual-doc-wasm` — and on no
# writer unless a feature asks for one. It is additive: the editor's
# `casual-doc-wasm` build does not depend on it and is unchanged by it.
#
# `cdylib` for the wasm-pack artefact the size measurement in `docs/176` §4 is
# taken from; `rlib` for native hosts and the example.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The wasm-bindgen façade (`WasmViewer`). Off for native consumers, so a server or
# a binding never links the JS glue.
wasm = ["dep:wasm-bindgen"]
# Same meaning as `casual-doc-wasm`'s: the browser host supplies Roboto/Noto, so
# their faces are dropped from the module (`webapp/build.sh` builds with it on).
web-host-fonts = ["casual-doc-layout/external-web-fonts"]
# Real-text vector PDF from the SAME layout the pages were rendered from.
# Note: `casual-doc-pdf` depends on `casual-doc-edit` for `ParagraphIndex`
# alone, so this feature links the edit crate (`docs/176` §4.3, prerequisite P2).
pdf = ["dep:casual-doc-pdf"]
# Every importer the editor opens (ODT, RTF, plain text, normalized JSON, DOTX)
# through the `casual-doc-io` registry. That registry also links every WRITER
# (DOCX semantic export, ODT, HTML, Markdown, PDF), because readers and writers
# are registered together — the measured cost is in `docs/176` §4.2, and the
# reader/writer split is prerequisite P1 there.
formats = ["dep:casual-doc-io"]

# Same wasm-opt pass as `casual-doc-wasm` (see the rationale there), so the two
# artefacts are measured under one optimiser setting.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-sign-ext', '--enable-nontrapping-float-to-int']

[dependencies]
casual-doc-import.workspace = true
casual-doc-layout.workspace = true
casual-doc-model.workspace = true
casual-doc-ooxml.workspace = true
casual-doc-render.workspace = true
casual-doc-io = { workspace = true, optional = true }
casual-doc-pdf = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[lints]
workspace = true
