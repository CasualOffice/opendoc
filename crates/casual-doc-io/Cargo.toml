[package]
name = "casual-doc-io"
description = "Format-neutral document import/export contracts and dispatch for OpenDoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
casual-doc-export.workspace = true
casual-doc-import.workspace = true
casual-doc-layout.workspace = true
casual-doc-model.workspace = true
casual-doc-odf.workspace = true
casual-doc-ooxml.workspace = true
# The real-text PDF backend behind the export-only `application.pdf` adapter.
casual-doc-pdf.workspace = true
casual-doc-rtf.workspace = true
# PDF import (docs/182 P1), behind `pdf-import`: off by default so the editor's
# WASM build neither compiles hayro nor offers PDF in File -> Open until P2.
casual-doc-pdf-import = { workspace = true, optional = true }
# The byte-preserving PDF save (docs/182 P4), also behind `pdf-import`: the
# reader opens the original's last revision and page parts (hayro-syntax, the
# parser import already admits files through), and the diff crate's content
# projection decides which pages are unchanged (G-6). Both are in-tree; no
# crate is added to Cargo.lock.
casual-doc-pdf-read = { workspace = true, optional = true }
casual-doc-diff = { workspace = true, optional = true }
casual-doc-pdf-wire = { workspace = true, optional = true }

[features]
default = []
# Compiles the PDF importer. A host still opts in at run time with
# `enable_pdf_import` / `builtin_registry_with_pdf_import`; the plain built-in
# registry never imports PDF, whatever features are on.
pdf-import = [
    "pdf-source",
    "dep:casual-doc-pdf-import",
    "dep:casual-doc-pdf-read",
    # A native host gets the standard 14 from the Liberation faces and
    # predefined CMaps from hayro-cmap's bundle (`docs/182` §17a).
    "casual-doc-pdf-read/liberation-faces",
    "casual-doc-pdf-read/embedded-cmaps",
]
# The hayro-free half of a PDF-origin session (`docs/182` §17a): the retained
# original, the byte-preserving save's plan and writer, and opening a session
# from the PDF module's package. What the editor's main WebAssembly module
# links: no reader, no importer, no hayro.
pdf-source = [
    "dep:casual-doc-diff",
    "dep:casual-doc-pdf-wire",
]

[dev-dependencies]
# The byte-preserving PDF save's guards render the saved file with a renderer
# we did not write the update with (already in the tree: the importer's oracle).
hayro = "0.8.0"
zip.workspace = true

[lints]
workspace = true
