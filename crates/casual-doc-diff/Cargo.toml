[package]
name = "casual-doc-diff"
description = "Structural version diff over two v1::Document states (docs/140 H3): semantic projection, anchored sequence alignment, typed change families"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
casual-doc-model.workspace = true
# `flow::append_node_plain_text` is the ONE answer in this workspace to "what text
# does this paragraph contain", in the same byte layout the shaper indexes and the
# review anchors (`{node, start, end}`) count in. A private copy here would be a
# fourth answer to that question, and the three that already existed disagreed
# (HF-213). So the diff takes the real one, at the cost of linking the layout
# crate; every host that can run a diff already links it.
casual-doc-layout.workspace = true
serde.workspace = true
# The typed-field comparator reflects a property struct's own serde field names
# rather than a hand-maintained list, so a property added to the model cannot
# become a silently uncompared one. See `compare::differing_field_paths`.
serde_json.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# The NodeId-stability guard has to IMPORT two DOCX packages to prove what node
# identity does and does not mean across two independently parsed checkpoints; a
# constructed fixture cannot answer that, because the answer is the importer's.
# Dev-only, and neither crate depends on this one, so there is no cycle (the same
# arrangement `casual-doc-edit` uses).
casual-doc-import.workspace = true
casual-doc-ooxml.workspace = true

[lints]
workspace = true
