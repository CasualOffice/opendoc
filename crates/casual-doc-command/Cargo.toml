[package]
name = "casual-doc-command"
description = "The one capability registry: every document-mutating command declared once, with the one lowering the editor and every agent front door share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `docs/181` and ADR-075. A feature's lowering lives here, not inside a wasm
# method, so the editor, `casual-doc-ai`, `opendoc-mcp` and the bindings reach
# it through one function, and a feature that is not classified for agents
# does not compile.

[dependencies]
casual-doc-edit.workspace = true
casual-doc-model.workspace = true

[lints]
workspace = true
