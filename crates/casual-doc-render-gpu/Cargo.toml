[package]
name = "casual-doc-render-gpu"
description = "Opt-in GPU backend for the OpenDoc display list (vello_hybrid on wgpu); the CPU raster stays the default and the reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `docs/179`, ADR-073 (Proposed). This crate paints the SAME display list
# `casual-doc-render` paints, and nothing depends on it by default: the editor's
# wasm build and every native host keep the CPU raster unless they opt in. The
# CPU raster stays the default and the golden reference; this backend is checked
# against it within the tolerance `tests/parity.rs` states.
#
# The encoder (display list -> `vello_common` drawing commands) is always built
# and has no GPU dependency. Two optional painters consume it:
#
# * `gpu`        — `vello_hybrid` on `wgpu` 29: the CPU builds sparse strips and
#                  the GPU does the fine rasterization. Native Metal, Vulkan and
#                  DX12, and WebGPU in a browser. The WebGL2 painter is
#                  `vello_hybrid/webgl` and is not wired yet (`docs/179` §7).
# * `sparse-cpu` — `vello_cpu`: the same sparse-strip pipeline on the CPU. It is
#                  how the encoder is checked on a machine with no GPU adapter
#                  (CI's Linux runners), and the measured CPU alternative in
#                  `docs/179` §4.
#
# Versions are the `vello_common` 0.2 family because it is the newest that keeps
# the workspace MSRV (1.88): `vello_cpu` 0.3 and `vello` 0.11 need 1.89.
[features]
default = []
gpu = ["dep:vello_hybrid", "dep:wgpu", "dep:pollster"]
sparse-cpu = ["dep:vello_cpu"]

[dependencies]
casual-doc-layout.workspace = true
casual-doc-render.workspace = true
casual-doc-model.workspace = true
skrifa = "0.44"
vello_common = { version = "0.2", default-features = false, features = ["std"] }
vello_cpu = { version = "0.2", optional = true, default-features = false, features = ["std", "u8_pipeline"] }
vello_hybrid = { version = "0.2", optional = true, default-features = false, features = ["wgpu", "wgpu_default"] }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
casual-doc-import.workspace = true
casual-doc-ooxml.workspace = true
zip.workspace = true

[[example]]
name = "gpu_profile"
required-features = ["gpu", "sparse-cpu"]

[lints]
workspace = true
