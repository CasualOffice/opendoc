[package]
name = "casual-doc-review"
description = "The one lowering of review edits (tracked suggestions, comments, accept/reject) shared by the editor and the Native SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `docs/178` §8 prerequisite A1 (ADR-072): the suggestion and comment lowering
# used to live inside `casual-doc-wasm`, so the Native SDK and the MCP server
# could not make a suggestion without a second lowering that would drift from the
# editor's. Both callers now go through this crate.

[dependencies]
casual-doc-edit.workspace = true
casual-doc-layout.workspace = true
casual-doc-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
