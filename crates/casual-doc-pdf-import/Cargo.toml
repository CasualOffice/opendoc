[package]
name = "casual-doc-pdf-import"
description = "PDF import for OpenDoc: page evidence to a fixed-layout v1::Document of page-anchored text boxes, pictures and shapes, with every inference and loss reported"
version.workspace = true
edition.workspace = true
# Through casual-doc-pdf-read, hayro 0.8 declares rust-version 1.92.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
casual-doc-model.workspace = true
casual-doc-pdf-read.workspace = true
# Asks whether an embedded program maps every character the PDF drew with it
# before registering it for editing (docs/182 G-1). Already in the tree (the
# renderer); pure Rust, WASM-clean.
skrifa = "0.43"
# The same read-fonts skrifa 0.43 re-exports (`skrifa::raw`), named directly
# only to enable `agl`: the Adobe Glyph List, which builds the Unicode cmap of
# a wrapped CFF or converted Type1 program from its glyph names (`fonts.rs`).
# No new crate or version enters the tree.
read-fonts = { version = "0.40", default-features = false, features = ["std", "agl"] }

[dev-dependencies]
# The oracle: hayro's own renderer draws the ORIGINAL page; ours draws the
# imported model. A comparison against a renderer we did not write.
hayro = "0.8.0"
# DOCX save and reopen for the edit round trip (no PDF feature needed there).
casual-doc-io.workspace = true
casual-doc-layout.workspace = true
casual-doc-render.workspace = true

[lints]
workspace = true
