[package]
name = "casual-doc-ai"
description = "The Rust core of opendoc.ai: anchored reading, retrieval chunks and closed edit plans for agents, over the same engine the editor uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `docs/178` §3-§5 and ADR-072. One implementation that every agent front door
# (the `opendoc-mcp` server now; the Python and JS packages later) adapts. It
# never calls a model and opens no network connection.

[dependencies]
casual-doc-command.workspace = true
casual-doc-diff.workspace = true
casual-doc-edit.workspace = true
casual-doc-io.workspace = true
casual-doc-layout.workspace = true
casual-doc-model.workspace = true
casual-doc-ooxml.workspace = true
casual-doc-review.workspace = true
casual-doc-transaction.workspace = true
opendoc-viewer.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Sessions open PDFs (docs/182 P1). `opendoc-mcp` turns this on; the editor's
# WASM build, which depends on this crate, does not.
pdf-import = ["casual-doc-io/pdf-import"]
# The heron layout model when a host's OCR models include one (docs/182 P6).
pdf-layout = ["pdf-ocr", "casual-doc-io/pdf-layout"]
pdf-ocr = ["pdf-import", "casual-doc-io/pdf-ocr"]

[dev-dependencies]
zip.workspace = true

[lints]
workspace = true
