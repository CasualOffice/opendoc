[package]
name = "opendoc-mcp"
description = "Model Context Protocol server over stdio for OpenDoc documents: read by anchor, edit as tracked suggestions, render, convert, compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `pdf-import`: open_document reads PDFs as fixed-layout documents (docs/182 P1),
# so an agent can read and suggest into one with no PDF-specific tool.
# `pdf-layout`: a host's `--ocr-models` directory may include the heron layout
# model (docs/182 P6); no crate is added for it.
casual-doc-ai = { workspace = true, features = ["pdf-import", "pdf-ocr", "pdf-layout"] }
casual-doc-command.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The conformance test builds a minimal DOCX with a table.
zip.workspace = true

[lints]
workspace = true
