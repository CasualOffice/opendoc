# Builds the developer site + pre-release WASM editor and deploys both to Pages.
#
# The root is an indexable developer landing page; `editor.html` remains the
# pre-release browser-first surface described in webapp/README.md.
name: Deploy developer site and WASM editor (Pages)

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "docs/assets/editor.jpg"
      - "fixtures/corpus/real-producer-rich.docx"
      - "sample.docx"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins Rust 1.96.0 + the wasm32-unknown-unknown target;
      # rustup honors it on the first cargo invocation. Warm it explicitly.
      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the site and WASM editor
        run: ./webapp/build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
