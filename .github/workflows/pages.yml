# Builds the developer site + pre-release WASM editor and deploys both to Pages.
#
# The root is an indexable developer landing page; `editor.html` remains the
# pre-release browser-first surface described in webapp/README.md.
name: Deploy developer site and WASM editor (Pages)

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "docs/assets/editor.jpg"
      - "fixtures/corpus/real-producer-rich.docx"
      - "sample.docx"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time — but NEVER cancel the run for `main`.
#
# `cancel-in-progress: true` was unconditional, so at this repository's merge
# cadence every merge killed the previous deploy before it finished and `main`
# collected a row of `cancelled` runs. `ci.yml` already fixed exactly this for
# itself and wrote down why: "`cancelled` reads as 'not a failure' at a glance,
# so a red `browser-smoke` sat on `main` unnoticed while three separate people
# and agents each independently re-derived whether it was theirs." That reasoning
# applies verbatim here, and this file was the half that still did it — a
# cancelled Pages run on `main` is indistinguishable at a glance from a failed
# deploy, and it was read as one.
#
# A branch still supersedes its own in-flight deploy: there the newest push is
# the only one whose answer anyone wants. The expression is deliberately the same
# shape as `ci.yml`'s so the two cannot drift.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins Rust 1.96.0 + the wasm32-unknown-unknown target;
      # rustup honors it on the first cargo invocation. Warm it explicitly.
      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: wasm-pack

      - name: Build the site and WASM editor
        run: ./webapp/build.sh

      # Pages caches .html for 10 minutes but .js/.css/.wasm for 4 hours, and the
      # site loaded them by fixed URL — so after a deploy a browser ran the new
      # page against the old script for hours (the Table menu opened empty in
      # production after #546). Version every script, stylesheet, module import
      # and the wasm binary with this commit, so they can only change together.
      - name: Version the site's assets with this commit
        run: ./webapp/stamp-assets.py webapp "${GITHUB_SHA::12}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
