# Oracle geometry re-bless (docs/94 H2).
#
# Renders the corpus fixtures with a PINNED LibreOffice and installs ONLY the
# bundled metric-compatible faces, then reduces each PDF to per-page geometry
# (scripts/oracle/extract-geometry.sh) and commits the references under
# fixtures/oracle/. Kept OFF the hermetic main CI: this is a manual, reviewed
# regeneration — the produced JSON lands via a PR whose diff a maintainer checks,
# exactly like any visual baseline change.
#
# The `oracle_geometry` test in casual-doc-render then diffs our layout against
# these references within tolerance; until this job has run, that test is inert.
name: Oracle geometry re-bless

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a PR with the regenerated references"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rebless:
    name: Regenerate LibreOffice geometry references
    runs-on: ubuntu-24.04
    # Pin the toolchain image by digest when adopting this in earnest so the
    # oracle is reproducible; ubuntu-24.04 ships a fixed LibreOffice for now.
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned LibreOffice and the bundled metric-compatible fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          # Fonts FIRST and ONLY the bundled families, so LibreOffice shapes with
          # the same metrics the engine does (docs/40). Do NOT install other font
          # packages here — extra faces would desync line breaking.
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea \
            libreoffice-writer-nogui poppler-utils python3
          soffice --version
          mkdir -p fixtures/oracle
          # Record the exact versions into the reference set for provenance.
          soffice --version > fixtures/oracle/.toolchain 2>/dev/null || true

      - name: Record which faces fontconfig actually resolved
        run: |
          set -euo pipefail
          # Installing a font package is not the same as LibreOffice using it.
          # This records what fontconfig resolved, so a reference can never be
          # produced by a silently substituted face without that being visible
          # in the diff.
          #
          # Scope, stated honestly: this guards the PINNED LATIN faces only. It
          # is NOT the explanation for the H2 residual — on the corpus fixture
          # the Latin runs already agree with LibreOffice to the twip (our 24pt
          # heading ends at 6919, LibreOffice's at 6919.04). The real gap is the
          # fixture's CJK/Arabic line, which NO pinned face covers, so every
          # environment substitutes differently (container 7933, macOS 6953,
          # ours 6885). docs/94's font-parity premise is Latin-only; the test
          # and the extractor both exclude uncoverable lines and compare the
          # excluded count exactly, which is what actually closes that hole.
          sudo fc-cache -f >/dev/null
          : > fixtures/oracle/.fonts
          status=0
          for family in "Liberation Sans" "Liberation Serif" "Liberation Mono" \
                        "Carlito" "Caladea"; do
            resolved="$(fc-match "$family" family | head -n1)"
            echo "$family => $resolved" | tee -a fixtures/oracle/.fonts
            if [ "$resolved" != "$family" ]; then
              echo "::error::fontconfig substituted '$resolved' for '$family' — the oracle would shape Latin text with the wrong face"
              status=1
            fi
          done
          exit "$status"

      - name: Extract per-fixture geometry references
        run: |
          set -euo pipefail
          mkdir -p fixtures/oracle
          # (id, path) pairs mirror the fixtures the oracle_geometry test targets.
          declare -A FIXTURES=(
            [docx-real-producer-libreoffice]="fixtures/corpus/real-producer-libreoffice.docx"
          )
          for id in "${!FIXTURES[@]}"; do
            echo "== $id =="
            scripts/oracle/extract-geometry.sh "${FIXTURES[$id]}" \
              > "fixtures/oracle/${id}.geom.json"
          done
          git diff --stat -- fixtures/oracle || true

      - name: Open a PR with the regenerated references
        if: ${{ inputs.open_pr }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: oracle/geometry-rebless
          title: "chore: re-bless LibreOffice oracle geometry references"
          commit-message: "chore: re-bless LibreOffice oracle geometry references"
          body: |
            Regenerated `fixtures/oracle/*.geom.json` from the pinned LibreOffice
            oracle (docs/94 H2). Review the geometry diff before merging — a change
            here means the reference moved, which should be an intended fixture or
            toolchain update, not a silent drift.
          add-paths: fixtures/oracle
