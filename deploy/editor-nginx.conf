# SPDX-License-Identifier: Apache-2.0
#
# The editor is STATIC FILES. This is the whole of the server side of it
# (`docs/162` §3) — there is no application behind this, no upstream, no
# database, and nothing here proxies anywhere, because format I/O is in the
# WebAssembly module the browser downloads from this directory.
#
# Non-root by construction: every path nginx writes to is under /tmp, so the
# container can run as the unprivileged `nginx` user with a read-only root
# filesystem.
pid /tmp/nginx.pid;
worker_processes auto;

# To the container's stdout/stderr, so `docker compose logs` is the log.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Every writable path under /tmp — nginx cannot write to /var/cache/nginx as
    # a non-root user, and the default paths are what make the official image
    # need root.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/wasm text/markdown;
    gzip_min_length 1024;

    server {
        # 8080, not 80: a port below 1024 needs a capability the unprivileged
        # user does not have. The published port is chosen in `docker-compose.yml`.
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/opendoc/webapp;
        index index.html;

        # NOTHING REWRITES A FONT URL, and that is a requirement rather than a
        # default. `webapp/src/fonts.css` self-hosts Inter and Material Symbols
        # Outlined from `../assets/fonts/*.woff2`, and
        # `webapp/tests/chrome_fonts.test.mjs` asserts the stylesheet contains no
        # `fonts.googleapis.com` or `fonts.gstatic.com` reference at all — that is
        # what keeps the editor's chrome working with no network. A
        # `sub_filter` or a CDN rewrite here would undo it in the one place no
        # test is looking, so this server block does exactly one thing: hand back
        # the bytes the build produced.
        location / {
            try_files $uri $uri/ =404;
        }

        # `application/wasm`, pinned per-location rather than in a `types` block
        # at `http` level, and the difference is a container that starts.
        # `include mime.types` has mapped `wasm` since nginx 1.21, and a second
        # mapping for an extension already in the types hash is not an override —
        # it is `nginx: [emerg] duplicate extension "wasm"`, so the first draft of
        # this file would have refused to boot. `types { }` empties the hash for
        # this location only, and `default_type` then answers for it.
        #
        # It is pinned at all because the whole local-first claim rests on the
        # module loading, and `WebAssembly.instantiateStreaming` REFUSES a module
        # that does not arrive as `application/wasm`. A silent fallback to
        # `application/octet-stream` is a blank editor with one console line.
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=3600";
        }

        # The fonts are content-addressed by the build rather than by a hash in
        # the name, so they are cached for an hour rather than forever: long
        # enough to matter on a reload, short enough that a redeployed image is
        # picked up without anyone clearing a cache. A fingerprinted asset
        # pipeline would earn `immutable`; this one has not.
        location ~* \.woff2$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # The HTML is never cached: `editor.html` and the generated pages change
        # with every deployment and a stale one loads a module that no longer
        # matches it.
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }

        # Health, for the container's own HEALTHCHECK and for a load balancer.
        # A static 200 from nginx rather than a file on disk, so it answers even
        # if a deployment mounted an empty document root — the question it
        # answers is "is this server serving", and `Dockerfile.editor`'s
        # healthcheck asks for a real page as well.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
