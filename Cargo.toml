[workspace]
members = [
    "crates/casual-doc-diff",
    "crates/casual-doc-edit",
    "crates/casual-doc-export",
    "crates/casual-doc-import",
    "crates/casual-doc-io",
    "crates/casual-doc-layout",
    "crates/casual-doc-loss",
    "crates/casual-doc-model",
    "crates/casual-doc-odf",
    "crates/casual-doc-package",
    "crates/casual-doc-pdf",
    "crates/casual-doc-ooxml",
    "crates/casual-doc-render",
    "crates/casual-doc-rtf",
    "crates/casual-doc-sdk",
    "crates/casual-doc-selection",
    "crates/casual-doc-transaction",
    "crates/casual-doc-wasm",
    "crates/casual-pres-export",
    "crates/casual-pres-import",
    "crates/casual-pres-layout",
    "crates/casual-pres-model",
    "crates/casual-pres-wasm",
    "server",
    "tools/opendoc-benchmark",
    "tools/opendoc-fidelity",
    "tools/opendoc-parity",
    "tools/opendoc-render",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/CasualOffice/opendoc"
authors = ["CasualOffice contributors"]

[workspace.dependencies]
casual-doc-diff = { path = "crates/casual-doc-diff", version = "=0.0.1" }
casual-doc-edit = { path = "crates/casual-doc-edit", version = "=0.0.1" }
casual-doc-export = { path = "crates/casual-doc-export", version = "=0.0.1" }
casual-doc-import = { path = "crates/casual-doc-import", version = "=0.0.1" }
casual-doc-io = { path = "crates/casual-doc-io", version = "=0.0.1" }
casual-doc-layout = { path = "crates/casual-doc-layout", version = "=0.0.1" }
casual-doc-loss = { path = "crates/casual-doc-loss", version = "=0.0.1" }
casual-doc-model = { path = "crates/casual-doc-model", version = "=0.0.1" }
casual-doc-odf = { path = "crates/casual-doc-odf", version = "=0.0.1" }
casual-doc-package = { path = "crates/casual-doc-package", version = "=0.0.1" }
casual-doc-pdf = { path = "crates/casual-doc-pdf", version = "=0.0.1" }
casual-doc-ooxml = { path = "crates/casual-doc-ooxml", version = "=0.0.1" }
casual-doc-render = { path = "crates/casual-doc-render", version = "=0.0.1" }
casual-doc-rtf = { path = "crates/casual-doc-rtf", version = "=0.0.1" }
casual-doc-sdk = { path = "crates/casual-doc-sdk", version = "=0.0.1" }
casual-doc-selection = { path = "crates/casual-doc-selection", version = "=0.0.1" }
casual-doc-transaction = { path = "crates/casual-doc-transaction", version = "=0.0.1" }
casual-doc-wasm = { path = "crates/casual-doc-wasm", version = "=0.0.1" }
casual-pres-export = { path = "crates/casual-pres-export", version = "=0.0.1" }
casual-pres-import = { path = "crates/casual-pres-import", version = "=0.0.1" }
casual-pres-layout = { path = "crates/casual-pres-layout", version = "=0.0.1" }
casual-pres-model = { path = "crates/casual-pres-model", version = "=0.0.1" }
casual-pres-wasm = { path = "crates/casual-pres-wasm", version = "=0.0.1" }
quick-xml = { version = "0.41.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
unicode-segmentation = "1.13.3"
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 1

# --- The crates that must keep opt-level 3 when the BROWSER build asks for size
#
# `webapp/build.sh` sets `CARGO_PROFILE_RELEASE_OPT_LEVEL=z` for the WebAssembly
# build only, because the editor page waits on the module and `opt-level = 3`
# buys throughput by emitting more code. Applied to everything, that is a bad
# trade: measured in one browser session, round-robin over four engine builds so
# machine conditions are shared, with `opt-level = z` everywhere a page render
# costs 2.5x and a document open 1.7x. The owner's constraint is that editing
# stays light (`docs/107` §4), so a module that is smaller and slower is not a
# win.
#
# These overrides are the other half of that setting: the crates on the layout,
# shaping, rasterization, model and import paths stay at opt-level 3, and only
# the cold bulk — export, ODF, RTF, PDF, diff, the wasm façade's own glue, the
# XML/ZIP/JSON plumbing — is built for size. Ratios against the all-3 baseline,
# medians over three sessions of seven rounds:
#
#                                   bytes   open   render   keystroke
#   opt-level 3 everywhere     26,070,655   1.00     1.00        1.00
#   z + these overrides        24,297,780   1.16     1.03        0.96
#   z everywhere               20,906,038   1.74     2.49        1.23
#
# so this configuration takes 1,772,875 B off the download (code section
# -14.4%, 12,376,042 -> 10,594,266) for no measurable cost to a keystroke or a
# page render. The further 3.4 MB that `z` everywhere would buy is NOT taken;
# 2.5x on a page render is a felt regression and the decision is the owner's.
#
# **These overrides are no-ops for every native build.** `[profile.release]`
# carries no `opt-level`, so a native release is already 3; setting 3 here
# writes the value it already had. The native engine, `opendoc-render` and the
# `opendoc-benchmark` smoke gate are unaffected — which is the point of putting
# the `z` in `build.sh` rather than in the profile.
#
# A name here that matches no package in the graph is a silent no-op that cargo
# warns about, so if one of these is renamed or dropped the build says so.
# `webapp/tests/wasm_size.test.mjs` is what notices the effect going away.
[profile.release.package.casual-doc-layout]
opt-level = 3
[profile.release.package.casual-doc-render]
opt-level = 3
[profile.release.package.casual-doc-model]
opt-level = 3
[profile.release.package.casual-doc-edit]
opt-level = 3
[profile.release.package.casual-doc-selection]
opt-level = 3
[profile.release.package.casual-doc-import]
opt-level = 3
[profile.release.package.casual-doc-io]
opt-level = 3
[profile.release.package.casual-doc-ooxml]
opt-level = 3
[profile.release.package.casual-doc-package]
opt-level = 3
[profile.release.package.casual-doc-transaction]
opt-level = 3
[profile.release.package.unicode-segmentation]
opt-level = 3
[profile.release.package.parley]
opt-level = 3
[profile.release.package.fontique]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package."tiny-skia"]
opt-level = 3
[profile.release.package.icu_properties]
opt-level = 3
[profile.release.package.icu_segmenter]
opt-level = 3
[profile.release.package.icu_normalizer]
opt-level = 3
