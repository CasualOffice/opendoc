<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenDoc — WASM viewer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark">OpenDoc</span>
        <span class="testing" title="Developer test harness — not a product or supported viewer.">testing</span>
        <span class="divider" hidden id="titleDivider"></span>
        <span class="doc-title" id="docTitle" hidden></span>
      </div>
      <div class="controls">
        <label class="btn btn-primary file">
          <input id="file" type="file" accept=".docx" hidden />
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          Open
        </label>
        <button id="save" type="button" class="btn" disabled title="Download the edited document">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10z"/></svg>
          Save
        </button>
        <button id="settingsBtn" type="button" class="btn icon-only" title="Settings" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.49.49 0 00.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
        </button>
      </div>
    </header>

    <div id="settingsPanel" class="settings-panel" hidden role="dialog" aria-label="Settings">
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="segmented" id="themeSeg" role="radiogroup" aria-label="Theme">
          <button type="button" data-theme="system">System</button>
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Accent</div>
        <div class="swatches" id="accentSwatches">
          <button type="button" class="acc" data-accent="#e2622a" style="--c:#e2622a" title="Orange" aria-label="Orange"></button>
          <button type="button" class="acc" data-accent="#2f7ae5" style="--c:#2f7ae5" title="Blue" aria-label="Blue"></button>
          <button type="button" class="acc" data-accent="#2aa775" style="--c:#2aa775" title="Green" aria-label="Green"></button>
          <button type="button" class="acc" data-accent="#8a63d2" style="--c:#8a63d2" title="Purple" aria-label="Purple"></button>
          <button type="button" class="acc" data-accent="#d64562" style="--c:#d64562" title="Rose" aria-label="Rose"></button>
          <button type="button" class="acc" data-accent="#c88a1a" style="--c:#c88a1a" title="Amber" aria-label="Amber"></button>
          <label class="acc acc-custom" title="Custom color">
            <input id="accentCustom" type="color" value="#e2622a" />
          </label>
        </div>
      </div>
      <div class="settings-foot">
        <span class="oss">Open-source · customizable</span>
        <button type="button" id="settingsReset" class="link">Reset</button>
      </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <div class="group">
        <label class="ctl" title="Paragraph style">
          <select id="paragraphStyle"><option value="">Style</option></select>
        </label>
        <label class="ctl" title="Font">
          <select id="fontFamily">
            <option value="">Font</option>
            <option>Arial</option><option>Calibri</option><option>Cambria</option>
            <option>Courier New</option><option>Georgia</option><option>Helvetica</option>
            <option>Roboto</option><option>Times New Roman</option><option>Verdana</option>
          </select>
        </label>
        <label class="ctl size" title="Font size (pt)">
          <select id="fontSize">
            <option value="">Size</option>
            <option>8</option><option>9</option><option>10</option><option>11</option>
            <option>12</option><option>14</option><option>16</option><option>18</option>
            <option>20</option><option>24</option><option>28</option><option>32</option>
            <option>36</option><option>48</option><option>72</option>
          </select>
        </label>
      </div>
      <div class="group">
        <button id="bold" type="button" class="fmt" title="Bold (⌘B)" aria-label="Bold" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg></button>
        <button id="italic" type="button" class="fmt" title="Italic (⌘I)" aria-label="Italic" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/></svg></button>
        <button id="underline" type="button" class="fmt" title="Underline (⌘U)" aria-label="Underline" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/></svg></button>
        <button id="strike" type="button" class="fmt" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z"/></svg></button>
        <label class="ctl swatch" title="Text color"><span>A</span><input id="textColor" type="color" value="#000000" /></label>
        <label class="ctl" title="Highlight">
          <select id="highlight">
            <option value="none">Highlight</option>
            <option value="yellow">Yellow</option><option value="green">Green</option>
            <option value="cyan">Cyan</option><option value="magenta">Magenta</option>
            <option value="red">Red</option><option value="none">None</option>
          </select>
        </label>
        <button id="superscript" type="button" class="fmt" title="Superscript" aria-label="Superscript"><svg viewBox="0 0 24 24"><path d="M22 7h-2v1h3v1h-4V7c0-.55.45-1 1-1h2V5h-3V4h3c.55 0 1 .45 1 1v1c0 .55-.45 1-1 1zM5.88 20h2.66l3.4-5.42h.12l3.4 5.42h2.66l-4.65-7.27L17.81 6h-2.68l-3.07 4.99h-.12L8.85 6H6.19l4.32 6.73L5.88 20z"/></svg></button>
        <button id="subscript" type="button" class="fmt" title="Subscript" aria-label="Subscript"><svg viewBox="0 0 24 24"><path d="M22 18h-2v1h3v1h-4v-2c0-.55.45-1 1-1h2v-1h-3v-1h3c.55 0 1 .45 1 1v1c0 .55-.45 1-1 1zM5.88 18h2.66l3.4-5.42h.12l3.4 5.42h2.66l-4.65-7.27L17.81 4h-2.68l-3.07 4.99h-.12L8.85 4H6.19l4.32 6.73L5.88 18z"/></svg></button>
      </div>
      <div class="group">
        <button id="alignStart" type="button" class="fmt" title="Align left" aria-label="Align left" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg></button>
        <button id="alignCenter" type="button" class="fmt" title="Center" aria-label="Center" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg></button>
        <button id="alignEnd" type="button" class="fmt" title="Align right" aria-label="Align right" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg></button>
        <button id="alignJustify" type="button" class="fmt" title="Justify" aria-label="Justify" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V7H3v2zm0-6v2h18V3H3z"/></svg></button>
        <button id="spacingBtn" type="button" class="fmt" title="Line &amp; paragraph spacing" aria-label="Line and paragraph spacing" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 7h2.5L5 3.5 1.5 7H4v10H1.5L5 20.5 8.5 17H6V7zm4-2v2h12V5H10zm0 14h12v-2H10v2zm0-6h12v-2H10v2z"/></svg></button>
        <button id="indentDec" type="button" class="fmt" title="Decrease indent (⇧Tab)" aria-label="Decrease indent"><svg viewBox="0 0 24 24"><path d="M11 17h10v-2H11v2zm-8-5l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg></button>
        <button id="indentInc" type="button" class="fmt" title="Increase indent (Tab)" aria-label="Increase indent"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg></button>
        <button id="paraOptsBtn" type="button" class="fmt" title="Paragraph options (shading, page breaks)" aria-label="Paragraph options" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M13 4v12h-2v-4c-2.21 0-4-1.79-4-4s1.79-4 4-4h7v2h-2v12h-2V6h-1V4h1z"/></svg></button>
      </div>
      <div class="group">
        <button id="bulletList" type="button" class="fmt" title="Bulleted list" aria-label="Bulleted list" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></button>
        <button id="numberedList" type="button" class="fmt" title="Numbered list" aria-label="Numbered list" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg></button>
      </div>
    </div>

    <div id="spacingMenu" class="context-menu spacing-menu" hidden role="menu" aria-label="Line and paragraph spacing">
      <div class="menu-heading">Line spacing</div>
      <button type="button" class="menu-item spacing-line" data-percent="100" role="menuitemradio"><span class="menu-check" aria-hidden="true"></span>Single</button>
      <button type="button" class="menu-item spacing-line" data-percent="115" role="menuitemradio"><span class="menu-check" aria-hidden="true"></span>1.15</button>
      <button type="button" class="menu-item spacing-line" data-percent="150" role="menuitemradio"><span class="menu-check" aria-hidden="true"></span>1.5</button>
      <button type="button" class="menu-item spacing-line" data-percent="200" role="menuitemradio"><span class="menu-check" aria-hidden="true"></span>Double</button>
      <div class="menu-divider"></div>
      <label class="menu-row">Space before<input id="spaceBefore" type="number" min="0" max="720" step="1" inputmode="numeric" /><span class="menu-unit">pt</span></label>
      <label class="menu-row">Space after<input id="spaceAfter" type="number" min="0" max="720" step="1" inputmode="numeric" /><span class="menu-unit">pt</span></label>
    </div>

    <div id="paraOptsMenu" class="context-menu spacing-menu" hidden role="menu" aria-label="Paragraph options">
      <div class="menu-heading">Indentation</div>
      <label class="menu-row">Left<input id="indentLeft" type="number" min="0" max="12" step="0.1" inputmode="decimal" /><span class="menu-unit">in</span></label>
      <label class="menu-row">Right<input id="indentRight" type="number" min="0" max="12" step="0.1" inputmode="decimal" /><span class="menu-unit">in</span></label>
      <div class="menu-row">
        <select id="indentSpecial" class="menu-select" aria-label="Special indent">
          <option value="none">None</option>
          <option value="first">First line</option>
          <option value="hanging">Hanging</option>
        </select>
        <input id="indentSpecialBy" type="number" min="0" max="12" step="0.1" inputmode="decimal" value="0.5" aria-label="Special indent amount" /><span class="menu-unit">in</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-heading">Shading</div>
      <div class="menu-row shade-row">
        <label class="shade-pick"><input id="paraShade" type="color" value="#ffe08a" /><span>Fill</span></label>
        <button type="button" id="paraShadeNone" class="chip-btn">None</button>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-heading">Borders</div>
      <div class="menu-row border-row">
        <div class="border-presets" role="group" aria-label="Paragraph borders">
          <button type="button" class="border-btn" data-border="none" title="No border" aria-pressed="false"><span class="bx"></span></button>
          <button type="button" class="border-btn" data-border="box" title="All borders" aria-pressed="false"><span class="bx"></span></button>
          <button type="button" class="border-btn" data-border="top" title="Top border" aria-pressed="false"><span class="bx"></span></button>
          <button type="button" class="border-btn" data-border="bottom" title="Bottom border" aria-pressed="false"><span class="bx"></span></button>
          <button type="button" class="border-btn" data-border="left" title="Left border" aria-pressed="false"><span class="bx"></span></button>
          <button type="button" class="border-btn" data-border="right" title="Right border" aria-pressed="false"><span class="bx"></span></button>
        </div>
        <label class="border-color" title="Border color"><input id="borderColor" type="color" value="#000000" /></label>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-heading">Line &amp; page breaks</div>
      <label class="menu-check-row"><input id="pgKeepNext" type="checkbox" />Keep with next</label>
      <label class="menu-check-row"><input id="pgKeepLines" type="checkbox" />Keep lines together</label>
      <label class="menu-check-row"><input id="pgBreakBefore" type="checkbox" />Page break before</label>
    </div>

    <main id="viewport" class="viewport">
      <div id="drop" class="drop">
        <div class="drop-card">
          <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          <p class="drop-title">Drop a <strong>.docx</strong> here</p>
          <p class="muted">or use <em>Open</em> above — rendered entirely in your browser by the OpenDoc engine (WASM). Nothing is uploaded.</p>
        </div>
      </div>
      <div id="pages" class="pages"></div>
    </main>

    <footer class="footer">
      <span class="foot-left">
        <span id="status" class="status">Loading engine…</span>
        <span class="stats" id="stats" hidden>
          <span id="statWords">0 words</span>
          <span class="dot">·</span>
          <span id="statParas">0 paragraphs</span>
        </span>
      </span>
      <span class="foot-right">
        <span id="statPages" class="stat-pages" hidden>Page 1 of 1</span>
        <span class="zoom">
          <button id="zoomOut" type="button" class="zbtn" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg></button>
          <select id="zoom" aria-label="Zoom level">
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
          <button id="zoomIn" type="button" class="zbtn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
        </span>
      </span>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
