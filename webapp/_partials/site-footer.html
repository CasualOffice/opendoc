<script>
  // Warm the engine on INTENT, not on arrival. The editor's wasm is the largest
  // thing this project ships, and it cannot start downloading until the editor
  // page is navigated to and its module graph resolves. Prefetching it when a
  // visitor hovers or focuses a link to the editor moves that transfer into the
  // seconds they spend deciding, so the editor has it in cache on arrival.
  //
  // Deliberately not unconditional: a visitor who only reads the docs should
  // never pay for the engine. `prefetch` is also the low-priority hint, so it
  // yields to anything this page still needs, and `save-data` opts out entirely.
  (() => {
    if (navigator.connection?.saveData) return;
    let warmed = false;
    const warm = () => {
      if (warmed) return;
      warmed = true;
      const link = document.createElement("link");
      link.rel = "prefetch";
      link.as = "fetch";
      link.crossOrigin = "anonymous";
      link.href = "./pkg/casual_doc_wasm_bg.wasm";
      document.head.appendChild(link);
    };
    for (const anchor of document.querySelectorAll('a[href*="editor.html"]')) {
      anchor.addEventListener("pointerenter", warm, { once: true, passive: true });
      anchor.addEventListener("focus", warm, { once: true, passive: true });
      anchor.addEventListener("touchstart", warm, { once: true, passive: true });
    }
  })();
</script>
