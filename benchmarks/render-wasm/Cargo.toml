[package]
name = "render-wasm-bench"
description = "Times the CPU raster and the sparse-strip encoder inside WebAssembly (docs/architecture/179 §2); not a workspace member"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Deliberately OUTSIDE the workspace (its own `[workspace]` below): it is a
# measuring harness built for `wasm32-unknown-unknown` with raw exports and no
# wasm-bindgen, so `node bench.mjs` can time it with `performance.now()`. It
# never ships and no gate builds it. Recipe: `docs/architecture/179` §2.

[lib]
crate-type = ["cdylib"]

[features]
sparse = ["casual-doc-render-gpu/sparse-cpu"]
gpu = ["casual-doc-render-gpu/gpu"]

[dependencies]
casual-doc-import = { path = "../../crates/casual-doc-import" }
casual-doc-ooxml = { path = "../../crates/casual-doc-ooxml" }
casual-doc-layout = { path = "../../crates/casual-doc-layout" }
casual-doc-render = { path = "../../crates/casual-doc-render" }
casual-doc-render-gpu = { path = "../../crates/casual-doc-render-gpu" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
